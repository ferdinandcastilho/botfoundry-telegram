version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: qa
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  - package-ecosystem: nuget
    directory: /
    target-branch: qa
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Updated together: bumping one Microsoft.Extensions package alone makes NuGet
      # report a package downgrade (NU1605) against its siblings.
      microsoft-extensions:
        patterns:
          - "Microsoft.Extensions.*"
      test-tools:
        patterns:
          - "Microsoft.NET.Test.Sdk"
          - "xunit*"
          - "coverlet.*"
          - "FluentAssertions"
          - "NSubstitute"
