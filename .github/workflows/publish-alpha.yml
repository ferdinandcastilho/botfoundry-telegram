name: Publish alpha

# Runs when a pull request is merged into qa (homologation).
# Version is computed by MinVer: <next patch>-alpha.0.<commit height>.

on:
  push:
    branches: [qa]
    # Documentation-only merges must not publish an alpha.
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/instructions/**'
      - '.github/workflows/notify.yml'
      - '.github/scripts/notify-telegram.sh'

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  publish:
    name: Publish alpha to NuGet
    runs-on: ubuntu-latest
    environment: nuget-alpha

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack src/BotFoundry.Telegram/BotFoundry.Telegram.csproj --no-build -c Release -o ./nupkg

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
