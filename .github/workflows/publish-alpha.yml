name: Publish alpha

# Runs when a pull request is merged into qa (homologation).
# Version is computed by MinVer: <next patch>-alpha.0.<commit height>.

on:
  push:
    branches: [qa]

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-alpha
  cancel-in-progress: false

jobs:
  publish:
    name: Publish alpha to NuGet
    runs-on: ubuntu-latest
    environment: nuget-alpha

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      - name: Test
        run: dotnet test --no-build -c Release

      - name: Pack
        run: dotnet pack src/BotFoundry.Telegram/BotFoundry.Telegram.csproj --no-build -c Release -o ./nupkg

      - name: NuGet login (trusted publishing)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push
        run: dotnet nuget push ./nupkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" --skip-duplicate
