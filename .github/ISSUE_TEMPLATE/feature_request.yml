name: Suggestion
description: Suggest an improvement or a new feature
labels: [feat]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or need
      description: What are you trying to do that the library does not support today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you imagine it working. Code samples welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
