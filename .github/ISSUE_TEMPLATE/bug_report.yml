name: Bug report
description: Something does not work as expected
labels: [fix]
body:
  - type: markdown
    attributes:
      value: |
        Do not include bot tokens or other secrets. For security problems use the private reporting described in SECURITY.md.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: A minimal handler, step or configuration that shows the problem.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: BotFoundry.Telegram version
      placeholder: 1.0.4
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: .NET version and OS
      placeholder: .NET 10, Linux
